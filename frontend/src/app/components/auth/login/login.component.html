<div class="container h-100">
  <div class="d-flex justify-content-center h-100">
    <div class="user_card">
      <div class="d-flex justify-content-center">
        <div class="brand_logo_container">
          <img src="https://cdn.pixabay.com/photo/2020/06/30/10/23/icon-5355893_960_720.png" class="brand_logo" alt="Logo">
        </div>
      </div>
      <div class="d-flex justify-content-center form_container">
        <form class="form" #f="ngForm" (ngSubmit)="userLogin()">
          <div class="input-group mb-3">
            <div class="input-group-append">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
            </div>
            <input type="email" class="form-control" name="email"  [(ngModel)]="model.email" aria-describedby="emailHelp" placeholder="Enter email">
          </div>
          <div class="input-group mb-2">
            <div class="input-group-append">
              <span class="input-group-text"><i class="fas fa-key"></i></span>
            </div>
            <input type="password" class="form-control" name="password"  [(ngModel)]="model.password" placeholder="Password">
          </div>

          <div class="d-flex justify-content-center mt-4 login_container">
            <button type="submit" name="button" class="btn login_btn">Login</button>
          </div>
        </form>
      </div>

      <div class="mt-4">
        <div class="d-flex justify-content-center links" style="color: #ffc000">
          Don't have an account? <a href="#" class="ml-2">Sign Up</a>
        </div>

      </div>
    </div>
  </div>
</div>
