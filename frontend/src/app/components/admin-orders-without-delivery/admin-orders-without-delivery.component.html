<div class="container my-4 display-6">
  Orders Without Deliverers
</div>

<div *ngIf="orders != null">
  <div class="container">
    <table class="table">
      <thead>
        <tr>
          <th scope='col'>#</th>
          <th scope='col'>Customer</th>
          <th scope='col'>Total</th>
          <th scope='col'>Location</th>
          <th scope='col'>Creation Date</th>
          <th scope='col'>details</th>
          <th scope='col'>Assign Deliverer</th>


        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders; let i = index;">
          <td *ngIf="order.is_accepted == 1" class="count">{{order.id}}</td>
          <td *ngIf="order.is_accepted == 1">{{order.user_name}}</td>
          <td *ngIf="order.is_accepted == 1">{{order.total}}</td>
          <td *ngIf="order.is_accepted == 1">{{order.address}}</td>
          <td *ngIf="order.is_accepted == 1">{{datePipe.transform(order.created_at, "dd/MM/yy - hh:mm:ss a")}}</td>
          <td *ngIf="order.is_accepted == 1"><span class="details-button" [routerLink]="'/orderDetails/' + order.id">Details</span></td>
          <td *ngIf="order.is_accepted == 1"><button type="button" class="btn btn-outline-primary" style="width: content-box;display: block;
            margin: auto;" [routerLink]="['/admin/assign-deliverer']" [queryParams]="{ id:order.id }">Assign</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<div *ngIf="orders == null" style="height:70vh; display: flex;align-items: center;
justify-content: center;">
  <div>
    <div class="spinner-border text-secondary" style="width: 15vh; height: 15vh;" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
</div>
