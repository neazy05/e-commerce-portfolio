<div class="container my-4 display-6">
  <button class="btn btn-outline-secondary" (click)="navigateBack()">back</button>
</div>
<div class="container my-4 display-6">
  Order #{{orderId}}
</div>
<div *ngIf="orderProducts != null">
  <div class="container">
    <table class="table">
      <thead>
        <tr>
          <th scope='col'>#</th>
          <th scope='col'>Product</th>
          <th scope='col'>Unit Price</th>
          <th scope='col'>Quantity</th>
          <th scope='col'>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of orderProducts">
          <th scope="row">{{product.id}}</th>
          <td class="details-button" [routerLink]="'/product/' + product.product_id">{{product.name}}</td>
          <td>{{product.product.price}}</td>
          <td>{{product.quantity}}</td>
          <td>{{product.total_price}}</td>
        </tr>
        <!-- <tr>
          <th scope="row"></th>
          <td></td>
          <td></td>
          <td></td>
          <td>{{totalPrice}}</td>
        </tr> -->
      </tbody>
    </table>
  </div>
</div>

<div *ngIf="orderProducts == null" style="height:70vh; display: flex;align-items: center;
justify-content: center;">
  <div>
    <div class="spinner-border text-secondary" style="width: 15vh; height: 15vh;" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
</div>
