<div class="container d-flex justify-content-center align-items-center">
  <div class="card">
    <div class="row">
      <div class="col-md-6">
        <div class="form">
          <h2>Registration</h2>
          <div class="inputbox mt-3"> <span>User Name</span> <input ngDefaultControl  type="text" class="form-control" id="username" required name="username" [(ngModel)]="profile.username"> </div>
          <div class="inputbox mt-3"> <span>Email</span> <input ngDefaultControl type="text" placeholder="Email" id="email" name="email" class="form-control" [(ngModel)]="profile.email"> </div>
          <div class="inputbox mt-3"> <span>password</span> <input ngDefaultControl  type="password" id="password" placeholder="*********" name="password" class="form-control" [(ngModel)]="profile.password"> </div>
          <label for="" class="mt-2">Value:</label>
          <select class="form-select" aria-label="Default select example" [(ngModel)]="profile.account_type">
            <option value="user">user</option>
            <option value="market">market</option>
            <option value="admin">admin</option>
            <option value="delivery">delivery</option>
          </select>
          <div class="d-flex justify-content-between align-items-center">
            <div class="text-right mt-4" > <button class="btn btn-primary register btn-block" (click)="register();">Register</button> </div>
          </div>

        </div>
      </div>
      <div class="col-md-6">
        <div class="text-center mt-5"> <img src="https://www.e-commercesummits.com/app/uploads/2020/12/eCommerce_Logo.png" width="400" height="400"> </div>
      </div>
    </div>
  </div>
</div>
