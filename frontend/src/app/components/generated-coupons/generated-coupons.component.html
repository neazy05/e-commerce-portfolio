<div class="container my-4 display-6">
  Available Coupons
</div>



<div *ngIf="codes != null">
  <div class="container">

    <div class="table-responsive-xl shadow-lg">
      <table class="table table-striped table-hover table-bordered-outside">
        <thead>
          <tr>
            <th scope='col'>#</th>
            <th scope='col'>Code</th>
            <th scope='col'>Value</th>
            <th scope='col'>Creation Date</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let code of codes; let i = index;">
            <td scope="row">{{code.id}}</td>
            <td>{{code.code}}</td>
            <td>{{code.amount}}</td>
            <td>{{datePipe.transform(code.created_at, "dd/MM/yyyy - hh:mm:ss a")}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div *ngIf="codes == null" style="height:70vh; display: flex;align-items: center;
justify-content: center;">
  <div>
    <div class="spinner-border text-secondary" style="width: 15vh; height: 15vh;" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
</div>
