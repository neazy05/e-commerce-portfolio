<div class="container my-4 display-6">
  <div class="row">
    <div class="col-md-3 col-xs-1 col-sm-1"></div>
    <div class="col-md-6 col-xs-10 col-sm-10">Add G</div>
    <div class="col-md-3 col-xs-1 col-sm-1"></div>
  </div>
</div>
<div class="container">
  <div class="row">
    <div class="col-md-3 col-xs-1 col-sm-1"></div>
    <div class="col-md-6 col-xs-10 col-sm-10">

      <label for="" class="mt-2">Category:</label>
      <input name="name" ngDefaultControl type="text" class="form-control" placeholder="Name" [(ngModel)]="cat.name" >
      <label class="form-label mt-3">Picture</label>
      <input class="form-control" type="file" (change)="onFileSelect($event)">
      <button class="btn btn-primary form-control mt-4" (click)="addGat();">Add cat</button>
    </div>
    <div class="col-md-3 col-xs-1 col-sm-1"></div>
  </div>
</div>
