<div class="container text-center " style="padding: 70px 0px;">
    <div class="row">
        <div class="col-sm-4"></div>
        <div class="col-sm-4 row py-5 p-4 bg-white rounded shadow-sm">
            <p class="h4 mb-3 bg-dark rounded-pill px-4 py-3 text-white" id="profilesetup-step">Delivery man's Sign up</p>
            <input type="text" class="form-control mb-4" placeholder="first name" required="required">
        <input type="text" class="form-control mb-4" placeholder="last name" required="required">
        <input type="text" class="form-control mb-4" placeholder="username" required="required">
        <select required="required" class="form-control mb-4 " >
            <option value="0">Select Country</option>
           <option value="damascus">damascus</option>
           <option value="Alleppo">Alleppo</option>
           <option value="Homs">Homs</option>
           <option value="Daraa">Daraa</option>
           <option value="Swieda">Swieda</option>
           <option value="Hama">Hama</option>
           <option value="Lattakia">Lattakia</option>
           <option value="Tartous">Tartous</option>
           <option value="Raqqa">Raqqa</option>
           <option value="Hasaka">Hasaka</option>
           <option value="Dier elzor">Dier elzor</option>
           <option value="Idleb">Idleb</option>    
       </select>
       <select required="required" class="form-control mb-4" >
           <option value="0">Select region</option>
           <option value="Mezzeh">Mezzeh</option>
           <option value="Bab-toma">Bab toma</option>
           <option value="Baghdad-st.">Baghdad st.</option>
           <option value="Mazraa">Mazraa</option>
       </select>
        <input type="email" id="defaultLoginFormEmail" class="form-control mb-4" placeholder="email" required="required">
        <input type="tel" pattern=".{10}" class="form-control mb-4" id="validationCustom08" placeholder="Mobile" oninput="check(this)" required>
  
        <!-- Password -->
        <input type="password" id="defaultLoginFormPassword" class="form-control mb-4" placeholder="Password" required="required">
        <input type="password" id="defaultLoginFormPassword" class="form-control mb-2" placeholder="confirm Password" required="required">
        <button class="btn btn-primary btn-lg pull-right nextBtn rounded-pill px-4 py-3" type="submit">Complete Registration</button>
      
        </div>
    </div>
</div>
