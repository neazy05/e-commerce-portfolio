<div class="container my-4 display-6">
  Currently-Available Deliverers
</div>

<div *ngIf="items != null">
  <div class="container">
    <table class="table">
      <thead>
        <tr>
          <th scope='col'>#</th>
          <th scope='col'>Deliverer</th>


        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items; let i = index;" (click)="RowSelected(item);">
          <td class="count">{{item.deliverer.id}}</td>
          <td>{{item.username}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<div *ngIf="items == null" style="height:70vh; display: flex;align-items: center;
justify-content: center;">
  <div>
    <div class="spinner-border text-secondary" style="width: 15vh; height: 15vh;" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
</div>
