  <div class="album py-5 bg-light">
    <div class="container">

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col" *ngFor="let product of products; let i = index;">
          <div class="card shadow-sm" >

            <svg class="bd-placeholder-img card-img-top" width="100%" height="225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: Thumbnail" preserveAspectRatio="xMidYMid slice" focusable="false" style="background-image: url({{sharedService.url+'/storage/image/'+product.picture}}); background-size: cover; height:350px;">  </svg>

            <div class="card-body">
              <p class="card-text">Name:{{product.name}}</p>
              <p class="card-text">{{product.description}}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">

                  <button type="button" class="btn btn-sm btn-outline-secondary"><i class="fa fa-heart" id="iconfavort" (click)="toggleicon(product)"></i></button>
                </div>
                <small class="text-muted">{{product.price}}$</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>
<div *ngIf="products == null " style="height:90vh; display: flex;align-items: center;
justify-content: center;">
  <div>
    <div class="spinner-border text-secondary" style="width: 15vh; height: 15vh;" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
</div>
